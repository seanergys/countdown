# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/#getting-started
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """
{% set repo_url = "https://gitlab.hpc.cineca.it/waldo/countdown-seanergys" -%}
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            {{ repo_url }}/-/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            {{ repo_url }}/-/tags/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: {{ repo_url }}/-/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
# Groups use the Keep a Changelog names; the HTML comment fixes their order.
# Older commits use the short scope "ad"; normalize it to "access-daemon".
commit_preprocessors = [
  { pattern = "^(\\w+)\\(ad\\)", replace = "${1}(access-daemon)" },
]
commit_parsers = [
  # "remove meric" predates the Conventional Commits convention and drops a
  # public feature, so it is classified as breaking by its hash.
  { sha = "d81960e6163f82fee0f2a5387cecf8c8e7d594a8", group = "<!-- 0 -->Breaking" },
  { message = "^[mM]erge branch", skip = true },
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
  { body = ".*[sS]ecurity", group = "<!-- 6 -->Security" },
  { message = "^[fF]eat", group = "<!-- 1 -->Added" },
  { message = "^[fF]ix", group = "<!-- 5 -->Fixed" },
  { message = "^([rR]efactor|[pP]erf|[dD]ocs|[tT]est)", group = "<!-- 2 -->Changed" },
  { message = "^([cC]hore|[sS]tyle|[cC]i|[bB]uild)", skip = true },
  { message = "^[dD]eprecate", group = "<!-- 3 -->Deprecated" },
  { message = "^([rR]emove|[dD]elete)", group = "<!-- 4 -->Removed" },
  { message = "^([aA]dd|[sS]upport)", group = "<!-- 1 -->Added" },
  { message = ".*", group = "<!-- 2 -->Changed" },
]
# Keep breaking commits even when a parser above would skip them.
protect_breaking_commits = true
# Prevent commits that are breaking from being excluded by commit parsers.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# The fork point is tagged upstream-2.0; skipping it drops the upstream history.
skip_tags = "^upstream-"
